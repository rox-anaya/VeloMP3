<!doctype html>
<!-- login.html: staff sign-in page. Uses Supabase Auth (email + password). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANVG Staff Login</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body data-page="login">
  <main class="login-wrap">
    <form id="loginForm" class="panel login-card">
      <h2>Staff login</h2>
      <label>Email <input type="email" id="email" required autocomplete="username"></label>
      <label>Password <input type="password" id="password" required autocomplete="current-password"></label>
      <p id="err" class="err hidden"></p>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Order matters: the Supabase library first, then our config. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    // Try to sign in. On success, go to the admin page.
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.classList.add('hidden');
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });
      if (error) {
        err.textContent = 'Sign in failed: ' + error.message;
        err.classList.remove('hidden');
        return;
      }
      location.href = 'admin.html';
    });
  </script>
</body>
</html>
